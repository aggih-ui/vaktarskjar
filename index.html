/* Bar layout fínstilling:

/* Veðurspá undir dyravörðum og fyrir ofan dagskrá */
.weather {display:none}
.weatherBox {
  height: calc(100% - 27px);
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 6px;
  overflow: hidden;
}
.weatherNow,
.weatherHours {
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 9px;
  padding: 6px 8px;
  overflow: hidden;
}
.weatherTemp {
  font-size: 25px;
  line-height: 1;
  font-weight: 900;
}
.weatherMeta {
  margin-top: 3px;
  font-size: 10px;

}

}
.weatherHourRain {

}

/* Myndrænni veðurspá */
.weatherNow {
  position: relative;
  display: grid;
  grid-template-columns: 64px 1fr;
  align-items: center;
  gap: 10px;
  transition: background .25s ease, border-color .25s ease;
}
.weatherNowIcon {
  width: 64px;
  height: 64px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 34px;
  background: rgba(255,255,255,.14);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.10);
}
.weatherNowBody {
  min-width: 0;
}
.weatherDesc {
  font-size: 12px;
  line-height: 1.1;
  font-weight: 900;
  margin-top: 2px;
}
.weatherTheme-clear {
  background: linear-gradient(135deg, rgba(245,158,11,.30), rgba(249,115,22,.18));
  border-color: rgba(251,191,36,.30);
}
.weatherTheme-partly {
  background: linear-gradient(135deg, rgba(59,130,246,.26), rgba(250,204,21,.15));
  border-color: rgba(96,165,250,.28);
}
.weatherTheme-cloudy {
  background: linear-gradient(135deg, rgba(100,116,139,.30), rgba(71,85,105,.18));
  border-color: rgba(148,163,184,.25);
}
.weatherTheme-rain {
  background: linear-gradient(135deg, rgba(37,99,235,.30), rgba(6,182,212,.16));
  border-color: rgba(56,189,248,.28);
}
.weatherTheme-storm {
  background: linear-gradient(135deg, rgba(124,58,237,.30), rgba(239,68,68,.16));
  border-color: rgba(196,181,253,.24);
}
.weatherTheme-fog {
  background: linear-gradient(135deg, rgba(148,163,184,.28), rgba(203,213,225,.12));
  border-color: rgba(226,232,240,.18);
}
.weatherTheme-snow {
  background: linear-gradient(135deg, rgba(186,230,253,.25), rgba(255,255,255,.12));
  border-color: rgba(191,219,254,.22);
}
.weatherHour {
  display: grid;
  grid-template-columns: 1fr;
  align-content: start;
  gap: 2px;
}
.weatherHourIcon {
  font-size: 15px;
  line-height: 1;
}


/* Minnka aðal veðurtáknið svo það fari ekki út fyrir kassann */
.weatherNow {

}

}

}
.weatherMeta {

}
.weatherHourly {
  grid-template-columns: repeat(4, 1fr) !important;
}

}


/* Veður v20: hitastig + vindur/rigning í sömu línu hægra megin */
.weatherHour {
  display: grid !important;
  grid-template-columns: 22px 34px minmax(0,1fr) !important;
  grid-template-rows: auto auto !important;
  column-gap: 6px !important;
  row-gap: 1px !important;
  align-items: center !important;
}
.weatherHourIcon {
  grid-column: 1 !important;
  grid-row: 1 / span 2 !important;

}

  grid-column: 2 / span 2 !important;

  grid-column: 3 !important;
  grid-row: 2 !important;
  font-size: 7.5px !important;
  line-height: 1 !important;
}
.weatherHourWind {
  transform: translateY(8px);
}
.weatherHourRain {
  transform: translateY(-2px);
}


/* Veður v21: laga hourly tákn, vindspá og m/s */
.weatherHourly {
  grid-template-columns: repeat(4, 1fr) !important;
  gap: 6px !important;
}
.weatherHour {
  display: grid !important;
  grid-template-columns: 18px 28px minmax(0,1fr) !important;
  grid-template-rows: auto auto !important;
  column-gap: 6px !important;
  row-gap: 2px !important;
  align-items: center !important;
  padding: 4px 6px !important;
  overflow: hidden !important;
}
.weatherHourIcon {
  grid-column: 1 !important;
  grid-row: 1 / span 2 !important;

  width: 18px !important;

  align-self: center !important;
}

  grid-column: 2 / span 2 !important;

  white-space: nowrap !important;

  text-overflow: ellipsis !important;
}
.weatherHourRain,
.weatherHourWind {
  display: none !important;
}


/* Veður v22: 2 línur í klst-spá - vindur efst, rigning neðst */
.weatherHour {
  display: grid !important;
  grid-template-columns: 18px 28px minmax(0,1fr) !important;
  grid-template-rows: auto auto auto !important;
  column-gap: 6px !important;
  row-gap: 1px !important;
  align-items: center !important;

  line-height: 1.08 !important;

<header><div><div class="date" id="dateLine">Sæki gögn...</div><h1 id="title">Hjarta Hafnarfjarðar 2026 - Vaktin í dag</h1></div><div class="headerRight"><div><div>Síðast uppfært: <span id="updated">—</span></div><div>Samtals: <span id="total">—</span></div></div><div class="logoBox" id="logoBox">LOGO</div></div></header>
<main class="layout" id="layout"><div class="error">Sæki gögn úr Google Sheet...</div></main>
<footer><span>Live Sheet Preview · 16:9 · 1920×1080</span><span id="apiStatus">API</span></footer>
</div>
<script>
const CONFIG = {
  API_BASE: "https://script.google.com/macros/s/AKfycby1-C_kBka4AtsVXRCW0JR4f4dxm2KMjCapR32u2mn17w_A5mDITW01RzUD3Zz97C-7/exec",
  SHEET: "auto",
  DAY: "27. júní",
  REFRESH_MS: 60000,
  SCREEN_TITLE: "Hjarta Hafnarfjarðar 2026 - Vaktin í dag"
};

function buildApiUrl() {
  const params = new URLSearchParams({
    sheet: CONFIG.SHEET,
    day: CONFIG.DAY
  });
  return `${CONFIG.API_BASE}?${params.toString()}`;
}
function fit(){const s=document.querySelector('.screen'),w=1920,h=1080,z=Math.min(innerWidth/w,innerHeight/h);s.style.transform=`translate(${(innerWidth-w*z)/2}px,${(innerHeight-h*z)/2}px) scale(${z})`}addEventListener('resize',fit);addEventListener('load',fit);
function norm(v){return String(v||'').toUpperCase().replace(/Á/g,'A').replace(/É/g,'E').replace(/Í/g,'I').replace(/Ó/g,'O').replace(/Ú/g,'U').replace(/Ý/g,'Y').replace(/Þ/g,'TH').replace(/Æ/g,'AE').replace(/Ö/g,'O').replace(/Ð/g,'D').trim()}
function esc(v){return String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}function attr(v){return esc(v).replace(/'/g,'&#039;')}
function initials(n){return String(n||'?').split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function stationKey(v){return norm(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'')}
function avatar(n){const l=initials(n),h=[...String(n||'')].reduce((s,c)=>s+c.charCodeAt(0),0)%360;return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="hsl(${h},62%,76%)"/><circle cx="50" cy="34" r="19" fill="rgba(17,24,39,.78)"/><path d="M18 96c4-28 22-42 32-42s28 14 32 42" fill="rgba(17,24,39,.78)"/><text x="50" y="90" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="white">${l}</text></svg>`}
window.demoAvatarFallback=avatar;
function avatarHtml(p){return p.photo&&/^https?:\/\//i.test(p.photo)?`<img src="${attr(p.photo)}" onerror="this.parentElement.innerHTML=window.demoAvatarFallback('${attr(p.name)}')">`:avatar(p.name)}
function txt(hex){if(!hex||!/^#[0-9a-f]{6}$/i.test(hex))return'#111827';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return((r*299+g*587+b*114)/1000)>150?'#111827':'#fff'}
function color(c){const x=String(c||'').trim().toLowerCase();return(!x||x==='#ffffff'||x==='white')?'#d1d5db':c}
function card(p){const c=color(p.color),fg=txt(c),start=p.start?`⏱ ${esc(p.start)}`:'',meal=p.meal?`🍽 ${esc(p.meal)}`:'',station=p.station?`📍 ${esc(p.station)}`:'';return `<article class="card" style="background:${c};color:${fg}"><div class="avatar">${avatarHtml(p)}</div><div><div class="name">${esc(p.name)}</div>${start?`<div class="meta">${start}</div>`:''}${meal?`<div class="meta">${meal}</div>`:''}${station?`<div class="meta">${station}</div>`:''}</div></article>`}
function groupBy(a,k){
  const m=new Map();
  a.forEach(i=>{
    const x=i[k]||'ANNAÐ';
    if(!m.has(x))m.set(x,[]);
    m.get(x).push(i);
  });

  return [...m.entries()].map(([station,people])=>({
    station,
    people:people.sort((a,b)=>norm(a.name).localeCompare(norm(b.name),'is'))
  }));
}
function sortGroups(g,o){return g.sort((a,b)=>(o.indexOf(a.station)<0?999:o.indexOf(a.station))-(o.indexOf(b.station)<0?999:o.indexOf(b.station))||a.station.localeCompare(b.station,'is'))}
function stationBlock(g){let cls='one';if(g.people.length>=10)cls='three';else if(g.people.length>=4)cls='two';return `<section class="station" data-key="${stationKey(g.station)}"><div class="stationHead"><span>${esc(g.station)}</span><span>${g.people.length}</span></div><div class="cards ${cls}">${g.people.map(card).join('')}</div></section>`}
function section(t,c,g){const n=g.reduce((s,x)=>s+x.people.length,0);return `<section class="panel ${c}"><div class="sectionHead"><h2>${esc(t)}</h2><span class="count">${n}</span></div><div class="stations">${g.map(stationBlock).join('')}</div></section>`}

function doorsSection(g){
  const n=g.reduce((s,x)=>s+x.people.length,0);
  return `<section class="panel doors">
    <div class="sectionHead"><h2>DYRAVERÐIR</h2><span class="count">${n}</span></div>
    <div class="stations">${g.map(stationBlock).join('')}</div>
    ${weatherInline()}
  </section>`;
}

function topRolesSection(a){return `<section class="topRoles">${a.map(p=>`<div class="roleBox"><div class="roleTitle">${esc(p.role||p.station||'')}</div>${card(p)}</div>`).join('')}</section>`}
function programSection(p){return `<section class="program"><div class="sectionHead"><h2>DAGSKRÁ DAGSINS</h2><span class="count">${p.length}</span></div><div class="programGrid">${p.map(x=>`<article class="programItem"><div class="programArea">${esc(x.area)}</div><div class="programName">${esc(x.title)}</div></article>`).join('')}</div></section>`}

const WEATHER_CONFIG = {
  name: "Hafnarfjörður",
  latitude: 64.0671,
  longitude: -21.9384
};

function weatherText(code) {
  const map = {
    0: "Heiðskírt",
    1: "Léttskýjað",
    2: "Hálfskýjað",
    3: "Skýjað",
    45: "Þoka",
    48: "Þoka",
    51: "Úði",
    53: "Úði",
    55: "Úði",
    61: "Rigning",
    63: "Rigning",
    65: "Mikil rigning",
    71: "Snjókoma",
    73: "Snjókoma",
    75: "Mikil snjókoma",
    80: "Skúrir",
    81: "Skúrir",
    82: "Miklar skúrir",
    95: "Þrumuveður"
  };
  return map[code] || "Veður";
}


function weatherIcon(code) {
  if (code === 0) return "☀️";
  if (code === 1 || code === 2) return "🌤️";
  if (code === 3) return "☁️";
  if (code === 45 || code === 48) return "🌫️";
  if ([51,53,55,61,63,65,80,81,82].includes(code)) return "🌧️";
  if ([71,73,75,77,85,86].includes(code)) return "❄️";
  if ([95,96,99].includes(code)) return "⛈️";
  return "🌦️";
}

function weatherTheme(code) {
  if (code === 0) return "weatherTheme-clear";
  if (code === 1 || code === 2) return "weatherTheme-partly";
  if (code === 3) return "weatherTheme-cloudy";
  if (code === 45 || code === 48) return "weatherTheme-fog";
  if ([51,53,55,61,63,65,80,81,82].includes(code)) return "weatherTheme-rain";
  if ([71,73,75,77,85,86].includes(code)) return "weatherTheme-snow";
  if ([95,96,99].includes(code)) return "weatherTheme-storm";
  return "weatherTheme-partly";
}

function weatherInline() {
  return `<div class="doorsWeather">
    <div class="stationHead"><span>VEÐURSPÁ</span><span>${esc(WEATHER_CONFIG.name)}</span></div>
    <div class="weatherBox" id="weatherBox">
      <div class="weatherNow weatherTheme-partly">
        <div class="weatherNowIcon">🌤️</div>
        <div class="weatherNowBody"><div class="weatherTemp">Sæki...</div><div class="weatherDesc">Veðurspá</div><div class="weatherMeta">Veðurspá fyrir svæðið</div></div>
      </div>
      <div class="weatherHours"></div>
    </div>
  </div>`;
}


function fetchWithTimeout(url, ms) {
  return Promise.race([
    fetch(url, { cache: "no-store" }),
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
  ]);
}

async function loadWeather() {
  const box = document.getElementById("weatherBox");
  if (!box) return;

  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_CONFIG.latitude}&longitude=${WEATHER_CONFIG.longitude}&current=temperature_2m,wind_speed_10m,precipitation,weather_code&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&forecast_days=1&timezone=auto`;
    const res = await fetchWithTimeout(url, 4500);
    const w = await res.json();

    const temp = Math.round(w.current?.temperature_2m ?? 0);
    const wind = Math.round((w.current?.wind_speed_10m ?? 0) / 3.6);
    const rain = w.current?.precipitation ?? 0;
    const desc = weatherText(w.current?.weather_code);

    const times = w.hourly?.time || [];
    const temps = w.hourly?.temperature_2m || [];
    const probs = w.hourly?.precipitation_probability || [];
    const winds = w.hourly?.wind_speed_10m || [];

    const now = new Date();
    let start = times.findIndex(t => new Date(t) >= now);
    if (start < 0) start = 0;

    const hours = [0, 2, 4, 6].map(offset => start + offset).filter(i => i < times.length);

    box.innerHTML = `
      <div class="weatherNow ${weatherTheme(w.current?.weather_code)}">
        <div class="weatherNowIcon">${weatherIcon(w.current?.weather_code)}</div>
        <div class="weatherNowBody">
          <div class="weatherTemp">${temp}°C</div>
          <div class="weatherDesc">${esc(desc)}</div>
          <div class="weatherMeta">vindur ${wind} m/s · úrkoma ${rain} mm</div>
        </div>
      </div>
      <div class="weatherHours">
        <div class="weatherHourly">
          ${hours.map(i => {
            const d = new Date(times[i]);
            const hh = d.toLocaleTimeString("is-IS", { hour: "2-digit", minute: "2-digit" });
            const hourlyCode = (w.hourly?.weather_code || [])[i];
            return `<div class="weatherHour">
              <div class="weatherHourTime">${hh}</div>
              <div class="weatherHourIcon">${weatherIcon(hourlyCode)}</div>
              <div class="weatherHourTemp">${Math.round(temps[i])}°</div>
              <div class="weatherHourWindLine">vindur ${Math.round((winds[i] ?? 0) / 3.6)} m/s</div>
              <div class="weatherHourRainLine">${probs[i] ?? 0}% rigning</div>
            </div>`;
          }).join("")}
        </div>
      </div>`;
  } catch (e) {
    box.innerHTML = `<div class="weatherNow weatherTheme-cloudy weatherUnavailable"><div class="weatherNowIcon">🌦️</div><div class="weatherNowBody"><div class="weatherTemp">—</div><div class="weatherDesc">Veður</div><div class="weatherMeta">spá ekki tiltæk núna</div></div></div><div class="weatherHours"><div class="weatherHourly"><div class="weatherHour"><div class="weatherHourIcon">—</div><div class="weatherHourTime">—</div><div class="weatherHourTemp">—</div><div class="weatherHourWindLine">vindur —</div><div class="weatherHourRainLine">rigning —</div></div></div></div>`;
  }
}

function build(data){const people=data.people||[],allTop=data.topRoles||[],program=data.program||[],lead=['SVÆÐISSTJÓRI','VAKTSTJÓRI','YFIRDYRAVÖRÐUR','TÆKNISTJÓRI'];const top=lead.map(r=>allTop.find(x=>norm(x.role)===norm(r)&&x.name)).filter(Boolean);const extra=allTop.filter(x=>!top.includes(x)&&x.name).map(x=>({...x,department:'AÐRIR',subgroup:x.role||'AÐRIR',station:x.role||x.station||'AÐRIR'}));const all=[...people,...extra];const bar=sortGroups(groupBy(all.filter(p=>p.department==='BARÞJÓNAR'),'subgroup'),['SKÚR','BJÓRGÁMUR','HJARTA BARINN','NÝI BAR','MATHIESEN','BOGABAR','ANNAÐ']);const cleaning=sortGroups(groupBy(all.filter(p=>p.department==='HREINSUNARDEILD'),'subgroup'),['ÞRIF #1','ÞRIF #2','ÞRIF #3','ÞRIF']);const doors=sortGroups(groupBy(all.filter(p=>p.department==='DYRAVERÐIR'),'subgroup'),['GÆSLA INNI','GÆSLA ÚTI','HLIÐ 1','HLIÐ 2','DYRAVERÐIR']);const others=sortGroups(groupBy(all.filter(p=>!['BARÞJÓNAR','HREINSUNARDEILD','DYRAVERÐIR'].includes(p.department)),'subgroup'),['TÆKNIMAÐUR INNI','TÆKNIMAÐUR ÚTI','HLJÓÐMAÐUR INNI','HLJÓÐMAÐUR ÚTI','LJÓSAMAÐUR INNI','LJÓSAMAÐUR ÚTI','LJÓSAMAÐUR','SVIÐSMAÐUR ÚTI','SVIÐSMAÐUR','HLJÓÐ / SVIÐ','RAFMAGN','ANNAÐ']);document.getElementById('layout').innerHTML=[topRolesSection(top),section('BARÞJÓNAR','bar',bar),doorsSection(doors),section('HREINSUNARDEILD','cleaning',cleaning),section('', 'others', others),programSection(program)].join('')}

let CURRENT_DAY_LABEL = "";

function formatDayLabel(day) {
  const value = String(day || "").trim();
  const n = value.toUpperCase();

  if (!value || n === "AUTO" || n === "TODAY" || n === "Í DAG" || n === "I DAG") {
    const now = new Date();
    const months = [
      "janúar",
      "febrúar",
      "mars",
      "apríl",
      "maí",
      "júní",
      "júlí",
      "ágúst",
      "september",
      "október",
      "nóvember",
      "desember"
    ];
    return `${now.getDate()}. ${months[now.getMonth()]}`;
  }

  return value.toLowerCase();
}

function updateHeaderClock() {
  const time = new Date().toLocaleTimeString("is-IS", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });

  const dayText = CURRENT_DAY_LABEL || CONFIG.DAY || "";
  const titleEl = document.getElementById("title");
  if (titleEl) {
    titleEl.textContent = `${CONFIG.SCREEN_TITLE} - Í dag er: ${formatDayLabel(dayText)} - ${time}`;
  }

  const emptyDayEl = document.getElementById("emptyDayClock");
  if (emptyDayEl) {
    emptyDayEl.textContent = `Í dag er: ${formatDayLabel(dayText)} - ${time}`;
  }
}

function hasNoUsableData(data) {
  const warnings = data?.debug?.warnings || [];
  const dayMissing = warnings.some(w => String(w).toLowerCase().includes("dagahaus"));
  const total = (data?.counts?.people || 0) + (data?.counts?.topRoles || 0) + (data?.counts?.program || 0);
  return dayMissing || total === 0;
}


function applyScreenBackground(backgroundUrl) {
  if (backgroundUrl) {
    document.querySelector(".screen").style.background =
      `linear-gradient(135deg,rgba(2,6,23,.55),rgba(0,0,0,.42)),url(${backgroundUrl}) center/cover`;
  }
}

function showLogoOnly(logoUrl) {
  const screen = document.querySelector(".screen");
  screen.classList.add("logoOnly");
  const safeLogo = logoUrl ? `<img src="${attr(logoUrl)}">` : `<div class="logoText">LOGO</div>`;
  document.getElementById("layout").innerHTML =
    `<div class="emptyLogo">${safeLogo}<div id="emptyDayClock" class="emptyDayClock"></div></div>`;
  updateHeaderClock();
}

async function load(){try{document.getElementById('apiStatus').textContent='Sæki gögn...';const res=await fetch(buildApiUrl(),{cache:'no-store'}),data=await res.json();if(!data.ok)throw new Error(data.error||'API villa');

    CURRENT_DAY_LABEL = data.day || CONFIG.DAY;
    applyScreenBackground(data.info?.backgroundImage || '');

    if(hasNoUsableData(data)){
      showLogoOnly(data.info?.emptyLogo || data.info?.logo || '');
      return;
    }

    document.querySelector('.screen').classList.remove('logoOnly');
    CURRENT_DAY_LABEL=data.day||CONFIG.DAY;
    updateHeaderClock();updateHeaderClock();document.getElementById('dateLine').textContent=`${data.day} · ${data.sheet}`;document.getElementById('total').textContent=data.counts?.totalCards??'—';document.getElementById('updated').textContent=new Date(data.generatedAt).toLocaleTimeString('is-IS',{hour:'2-digit',minute:'2-digit'});document.getElementById('apiStatus').textContent=`Live gögn · fólk ${data.counts?.people??0} · titlar ${data.counts?.topRoles??0} · dagskrá ${data.counts?.program??0}`;if(data.info?.logo)document.getElementById('logoBox').innerHTML=`<img src="${attr(data.info.logo)}">`;if(data.info?.backgroundImage)document.querySelector('.screen').style.background=`linear-gradient(135deg,rgba(2,6,23,.88),rgba(0,0,0,.78)),url(${data.info.backgroundImage}) center/cover`;build(data);loadWeather()}catch(e){document.getElementById('layout').innerHTML=`<div class="error">Villa við að sækja gögn: ${esc(e.message||e)}</div>`;document.getElementById('apiStatus').textContent='Villa'}}
CURRENT_DAY_LABEL=CONFIG.DAY;updateHeaderClock();fit();load();setInterval(load,CONFIG.REFRESH_MS);setInterval(updateHeaderClock,1000);setInterval(loadWeather,1800000);
</script></body></html>
